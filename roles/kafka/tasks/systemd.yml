---
- name: Install Kafka systemd service
  ansible.builtin.template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
    owner: root
    group: root
    mode: "0644"
  register: kafka_systemd_unit

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Mark Kafka service as created
  ansible.builtin.set_fact:
    kafka_service_created: true

- name: Enable and start Kafka
  ansible.builtin.systemd:
    name: kafka
    enabled: true
    state: started
  register: kafka_service_start

- name: Wait for Kafka broker port
  ansible.builtin.wait_for:
    host: "{{ kafka_host }}"
    port: "{{ kafka_broker_port }}"
    state: started
    timeout: 120
    delay: 5

- name: Get Kafka service status
  ansible.builtin.command:
    cmd: systemctl is-active kafka
  register: kafka_service_status
  changed_when: false

- name: Verify Kafka service is running
  ansible.builtin.assert:
    that:
      - kafka_service_status.stdout == "active"
    fail_msg: >-
      Kafka service is not running on {{ inventory_hostname }}.
      Check: journalctl -u kafka -n 100 --no-pager

- name: Display Kafka service status
  ansible.builtin.debug:
    msg:
      - "========================================"
      - "Kafka systemd service"
      - "Node    : {{ inventory_hostname }}"
      - "Service : kafka"
      - "Status  : {{ kafka_service_status.stdout }}"
      - "Broker  : {{ kafka_host }}:{{ kafka_broker_port }}"
      - "========================================"
